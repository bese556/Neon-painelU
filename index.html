<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON X PANEL</title>

<style>
*{
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    margin:0;
    background:#111;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.panel{
    width:360px;
    background:#0d0d0f;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 0 25px #7000ff;
}

.header{
    padding:18px;
    text-align:center;
    font-size:22px;
    letter-spacing:5px;
    border-bottom:1px solid #333;
}

.page{
    padding:20px;
}

.hidden{
    display:none;
}

input{
    width:100%;
    padding:12px;
    margin:8px 0 15px;
    background:#1c1c20;
    color:white;
    border:1px solid #444;
    border-radius:8px;
}

button{
    width:100%;
    padding:12px;
    background:#7b00ff;
    color:white;
    border:0;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    background:#9900ff;
}

.info{
    text-align:center;
    color:#aaa;
    margin-top:15px;
}

.status{
    padding:15px;
    border-bottom:1px solid #333;
}

.green{
    color:#00ff88;
}

.feature{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:13px 0;
    border-bottom:1px solid #222;
}

.switch{
    width:42px;
    height:22px;
}

.fov{
    margin-top:20px;
}

input[type=range]{
    accent-color:#8b00ff;
}

.activation{
    text-align:center;
}

a{
    color:#00aaff;
}
</style>

</head>

<body>


<div class="panel">

<div class="header">
N E O N  X  P A N E L
</div>


<!-- LOGIN PAGE -->

<div id="login" class="page">

<h3 style="text-align:center">LOGIN</h3>

<label>Username</label>
<input id="Betseking" placeholder="Enter username">

<label>Password</label>
<input id="Betsecheats" type="password" placeholder="Enter password">


<button onclick="login()">
LOGIN
</button>


<div class="info">
Contact TG: <b>NEONTOPUP0</b><br>
to get access
</div>

</div>



<!-- MAIN PANEL -->

<div id="main" class="page hidden">


<div class="status">
🟢 <span class="green">
STATUS ONLINE
</span>
<br>
VERSION 1.0
</div>


<h3>
N E O N  FEATURES
</h3>


<div class="feature">
BETA MOVEMENT
<input type="checkbox">
</div>


<div class="feature">
AIM DRAG MODE
<input type="checkbox">
</div>


<div class="feature">
FLIGHT TRAINING
<input type="checkbox">
</div>


<div class="feature">
PERFORMANCE MODE
<input type="checkbox">
</div>


<div class="feature">
FPS MONITOR
<input type="checkbox">
</div>



<div class="fov">

<h3>
FOV SETTINGS
</h3>

FOV:
<span id="fov">
360
</span>°

<input type="range" min="0" max="360" value="360"
oninput="changeFov(this.value)">

</div>


<br>

<button onclick="startPanel()">
START
</button>


</div>




<!-- ACTIVATION PAGE -->


<div id="activate" class="page hidden activation">

<h2>
🚀 PANEL STARTED
</h2>

<hr>

<h3>
ACTIVATION REQUIRED
</h3>


<button onclick="activate()">
ACTIVATE
</button>


<br><br>


Need help?

<br>

Telegram:
<b>NEONTOPUP0</b>


<br><br>


<button onclick="telegram()">
CONTACT
</button>


</div>


</div>



<script>

function login(){

let u=document.getElementById("user").value;
let p=document.getElementById("pass").value;


if(u && p){

document.getElementById("login").classList.add("hidden");

document.getElementById("main").classList.remove("hidden");

}else{

alert("Enter username and password");

}

}



function startPanel(){

document.getElementById("main").classList.add("hidden");

document.getElementById("activate").classList.remove("hidden");

}



function changeFov(value){

document.getElementById("fov").innerHTML=value;

}



function telegram(){

window.open(
"https://t.me/NEONTOPUP0",
"_blank"
);

}


function activate(){

alert("Activation page opened");

}

</script>


</body>
</html>
